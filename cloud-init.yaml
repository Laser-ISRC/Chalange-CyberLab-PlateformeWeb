#cloud-config
hostname: @@VM_HOSTNAME@@
manage_etc_hosts: true
disable_root: true
ssh_pwauth: true

users:
  - default
  - name: @@VM_USERNAME@@
    gecos: Utilisateur du CyberLab
    groups:
      - sudo
    shell: /bin/bash
    lock_passwd: false
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - @@SSH_PUBLIC_KEY@@

chpasswd:
  expire: false
  users:
    - name: @@VM_USERNAME@@
      password: "@@VM_PASSWORD_HASH@@"
      type: hash

write_files:
  - path: /etc/ssh/sshd_config.d/99-cyberlab.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication yes
      PubkeyAuthentication yes
      PermitRootLogin no

package_update: true
packages:
  - sudo
  - curl
  - ca-certificates
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  - [sh, -c, "systemctl restart ssh || systemctl restart sshd"]

final_message: "CyberLab prêt après $UPTIME secondes"
